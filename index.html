<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Kesabaran</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            perspective: 1000px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
            transition: all 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-5px, 0); }
            20%, 40%, 60%, 80% { transform: translate(5px, 0); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #d35400;
            font-size: 2.3rem;
            margin-top: 0;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .btn {
            font-family: 'Fredoka One', cursive;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .btn:hover { transform: translateY(-3px) scale(1.05); }
        .btn-green { background: #2ecc71; }
        .btn-blue { background: #3498db; }
        .btn-red { background: #e74c3c; font-size: 1.4rem; padding: 18px 40px; }
        .btn-orange { background: #e67e22; }
        .btn-purple { background: #9b59b6; }

        .img-box {
            width: 100%;
            max-height: 250px;
            overflow: hidden;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 4px solid #f39c12;
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Jumpscare Layar Penuh */
        .jumpscare-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: black;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .jumpscare-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .jumpscare-overlay .btn-stop {
            position: absolute;
            bottom: 50px;
            z-index: 10000;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div id="contentArea">
            <div id="stage1">
                <h1>HAI MONYET 🐒</h1>
                <button class="btn btn-green" onclick="goStage(2)">Tekan Aku</button>
            </div>
        </div>
    </div>

    <div id="jumpscareArea" class="jumpscare-overlay">
        <img id="jumpscareImg" src="" alt="BOO!">
        <button id="btnStop" class="btn btn-red btn-stop" onclick="stopJumpscare()" style="display:none;">Berhenti!</button>
        <button id="btnFinish" class="btn btn-purple btn-stop" onclick="finishPrank()" style="display:none;">Selesai</button>
    </div>

    <script>
        const stages = {
            2: {
                text: "INI ADALAH KAMU! 🫵🔥",
                img: "https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=500", 
                btnText: "Klik lagi aku",
                btnClass: "btn-blue",
                next: 3
            },
            3: {
                text: "Ini juga mirip sama kamu 🐷",
                img: "https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=500", 
                btnText: "Jangan di klik 🛑",
                btnClass: "btn-red",
                next: 'jumpscare1'
            },
            5: { 
                text: "WAHAHAHA, Monyet Monyet, Eh salah Babi ya? 😹",
                img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500", 
                btnText: "Selesai",
                btnClass: "btn-orange",
                next: 'jumpscare2'
            },
            7: { 
                text: "Selamat ya monyet eh babi, udh selesai kok! 🥳👑",
                img: "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=500", 
                btnText: "Main Lagi 🔄",
                btnClass: "btn-green",
                next: 1
            }
        };

        function goStage(stageNum) {
            const card = document.getElementById('mainCard');
            const area = document.getElementById('contentArea');
            
            card.classList.remove('shake');
            void card.offsetWidth; 
            card.classList.add('shake');

            if(stageNum === 1) {
                area.innerHTML = `
                    <div id="stage1">
                        <h1>HAI MONYET 🐒</h1>
                        <button class="btn btn-green" onclick="goStage(2)">Tekan Aku</button>
                    </div>
                `;
                return;
            }

            const data = stages[stageNum];
            
            area.innerHTML = `
                <div class="img-box">
                    <img src="${data.img}" alt="visual">
                </div>
                <h1>${data.text}</h1>
                <button class="btn ${data.btnClass}" onclick="handleNext('${data.next}')">${data.btnText}</button>
            `;
        }

        function handleNext(target) {
            if (target === 'jumpscare1') {
                triggerJumpscare("https://images.unsplash.com/photo-1509248961158-e54f6934749c?w=1000", 'btnStop'); 
            } else if (target === 'jumpscare2') {
                triggerJumpscare("https://images.unsplash.com/photo-1518156677180-95a2893f3e9f?w=1000", 'btnFinish'); 
            } else {
                goStage(parseInt(target));
            }
        }

        function triggerJumpscare(imgUrl, btnToShow) {
            const overlay = document.getElementById('jumpscareArea');
            const img = document.getElementById('jumpscareImg');
            
            img.src = imgUrl;
            overlay.style.display = 'flex';

            document.getElementById('btnStop').style.display = 'none';
            document.getElementById('btnFinish').style.display = 'none';

            setTimeout(() => {
                document.getElementById(btnToShow).style.display = 'block';
            }, 1500);
        }

        function stopJumpscare() {
            document.getElementById('jumpscareArea').style.display = 'none';
            goStage(5); 
        }

        function finishPrank() {
            document.getElementById('jumpscareArea').style.display = 'none';
            goStage(7); 
        }
    </script>
</body>
</html>
